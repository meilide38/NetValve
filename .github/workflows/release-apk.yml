name: Build Release APK

on:
  workflow_dispatch:
    inputs:
      engine:
        description: "Packet engine (netstack = real forwarding, loopback = dev stub)"
        type: choice
        options:
          - netstack
          - loopback
        default: netstack
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # Keep the toolchain fixed: go.mod wants 1.25, the pinned gomobile needs 1.25+.
      # Toolchain auto-download is unreliable on CI, so never switch mid-build.
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false

      - name: Locate Android SDK / NDK
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_LATEST_HOME}" >> "$GITHUB_ENV"
          echo "NDK=$ANDROID_NDK_LATEST_HOME"

      - name: Build gVisor netstack bridge (gomobile -> app/libs/netstack.aar)
        if: ${{ github.event.inputs.engine != 'loopback' }}
        working-directory: netstack
        run: |
          chmod +x build-aar.sh
          ./build-aar.sh arm64

      - name: Generate release signing key
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias netvalve \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass netvalve2024 -keypass netvalve2024 \
            -dname "CN=NetValve, OU=Mobile, O=NetValve, L=Internet, ST=NA, C=US"
          cat > keystore.properties <<'EOF'
          storeFile=release.keystore
          storePassword=netvalve2024
          keyAlias=netvalve
          keyPassword=netvalve2024
          EOF

      - name: Build release APK
        run: |
          FLAG=""
          if [ "${{ github.event.inputs.engine }}" != "loopback" ]; then FLAG="-Pnetvalve.netstack=true"; fi
          ./gradlew --no-daemon -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g" \
            :app:assembleRelease $FLAG

      - name: Verify + rename APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "Built: $APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" || true
          mkdir -p dist
          cp "$APK" dist/NetValve-1.0.0-release.apk
          ls -lh dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NetValve-release-apk
          path: dist/NetValve-1.0.0-release.apk
          if-no-files-found: error
