name: Build Netstack APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "netstack/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/netstack-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Build real gVisor netstack AAR
        working-directory: netstack
        env:
          GOTOOLCHAIN: auto
        run: |
          chmod +x ./build-aar.sh
          ./build-aar.sh arm64

      - name: Run unit tests and build installable APK
        env:
          GOTOOLCHAIN: auto
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug -Pnetvalve.netstack=true

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-netstack-arm64-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          mkdir -p release
          cp "$APK" release/NetValve-netstack-arm64.apk

      - name: Upload APK artifact (fallback download)
        uses: actions/upload-artifact@v4
        with:
          name: NetValve-netstack-arm64
          path: release/NetValve-netstack-arm64.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: netstack-build-${{ github.run_number }}
          name: NetValve Netstack APK (build ${{ github.run_number }})
          prerelease: true
          generate_release_notes: true
          files: release/NetValve-netstack-arm64.apk
          fail_on_unmatched_files: true
